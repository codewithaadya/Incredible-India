<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#183D32"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g)"/>
  <!-- Mountain peaks -->
  <polygon points="0,400 100,150 200,400" fill="rgba(200,220,240,0.55)"/>
  <polygon points="80,400 220,80 360,400" fill="rgba(220,235,250,0.7)"/>
  <polygon points="240,400 380,110 520,400" fill="rgba(200,220,240,0.6)"/>
  <polygon points="400,400 520,160 600,300 600,400" fill="rgba(215,230,248,0.5)"/>
  <!-- Snow caps -->
  <polygon points="220,80 200,120 240,120" fill="rgba(255,255,255,0.9)"/>
  <polygon points="100,150 82,180 118,180" fill="rgba(255,255,255,0.8)"/>
  <polygon points="380,110 360,145 400,145" fill="rgba(255,255,255,0.85)"/>
  <!-- Pine trees silhouette -->
  <g fill="rgba(20,60,35,0.85)">
    <polygon points="50,320 58,280 66,320"/>
    <polygon points="90,330 100,285 110,330"/>
    <polygon points="130,325 140,278 150,325"/>
    <polygon points="440,325 450,278 460,325"/>
    <polygon points="480,320 490,282 500,320"/>
    <polygon points="520,328 530,288 540,328"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="340" width="600" height="60" fill="rgba(20,60,35,0.6)"/>
  <text x="300" y="375" text-anchor="middle"
        font-family="Georgia, serif" font-size="20" font-weight="700"
        letter-spacing="0.1em" fill="rgba(255,255,255,0.95)">HIMACHAL PRADESH</text>
</svg>
