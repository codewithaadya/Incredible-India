<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="40%" stop-color="#1a1a35"/>
      <stop offset="100%" stop-color="#F5F5F0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g)"/>
  <!-- Stars -->
  <g fill="rgba(255,255,255,0.7)">
    <circle cx="60" cy="40" r="1.5"/><circle cx="150" cy="25" r="1.2"/><circle cx="250" cy="50" r="1.8"/>
    <circle cx="380" cy="30" r="1.3"/><circle cx="480" cy="55" r="1.5"/><circle cx="540" cy="20" r="1"/>
    <circle cx="100" cy="80" r="1"/><circle cx="330" cy="70" r="1.4"/><circle cx="430" cy="85" r="1.2"/>
  </g>
  <!-- Moon -->
  <circle cx="500" cy="80" r="28" fill="rgba(250,240,200,0.7)"/>
  <!-- Salt flats (white) -->
  <rect x="0" y="260" width="600" height="140" fill="rgba(245,245,240,0.85)"/>
  <!-- Salt flat texture -->
  <g stroke="rgba(200,200,195,0.4)" stroke-width="0.8" fill="none">
    <line x1="0" y1="280" x2="600" y2="278"/><line x1="0" y1="300" x2="600" y2="302"/>
    <line x1="0" y1="320" x2="600" y2="318"/><line x1="0" y1="340" x2="600" y2="342"/>
    <line x1="100" y1="260" x2="90" y2="400"/><line x1="250" y1="260" x2="240" y2="400"/>
    <line x1="400" y1="260" x2="390" y2="400"/><line x1="550" y1="260" x2="540" y2="400"/>
  </g>
  <!-- Reflection of moon -->
  <ellipse cx="500" cy="270" rx="22" ry="8" fill="rgba(250,240,200,0.3)"/>
  <text x="300" y="360" text-anchor="middle"
        font-family="Georgia, serif" font-size="18" font-weight="700"
        letter-spacing="0.08em" fill="rgba(30,30,50,0.9)">RANN OF KUTCH</text>
  <text x="300" y="385" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="11" letter-spacing="0.12em"
        fill="rgba(30,30,50,0.5)">GUJARAT</text>
</svg>
