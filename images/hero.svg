<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102820"/>
      <stop offset="60%" stop-color="#183D32"/>
      <stop offset="100%" stop-color="#1e4a3e"/>
    </linearGradient>
    <linearGradient id="glow" cx="50%" cy="30%" r="50%" fx="50%" fy="30%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E89B3C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E89B3C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E89B3C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sky gradient -->
  <rect width="1400" height="700" fill="url(#sky)"/>
  <!-- Radial glow -->
  <ellipse cx="700" cy="220" rx="500" ry="300" fill="url(#glow)"/>
  <!-- Subtle dot pattern -->
  <pattern id="hdots" patternUnits="userSpaceOnUse" width="40" height="40">
    <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="1400" height="700" fill="url(#hdots)"/>
  <!-- Silhouetted horizon hills -->
  <path d="M0 560 Q200 460 350 500 Q500 540 650 480 Q750 440 900 490 Q1050 540 1200 480 Q1320 440 1400 470 L1400 700 L0 700 Z"
        fill="rgba(16,40,32,0.7)"/>
  <path d="M0 580 Q150 540 300 555 Q500 575 700 545 Q900 515 1100 555 Q1280 575 1400 550 L1400 700 L0 700 Z"
        fill="rgba(12,30,24,0.85)"/>
  <!-- Sun -->
  <circle cx="700" cy="200" r="55" fill="url(#sun-glow)"/>
  <circle cx="700" cy="200" r="32" fill="#E89B3C" opacity="0.85"/>
  <!-- Sun rays -->
  <g stroke="#E89B3C" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="700" y1="155" x2="700" y2="143"/>
    <line x1="700" y1="245" x2="700" y2="257"/>
    <line x1="655" y1="200" x2="643" y2="200"/>
    <line x1="745" y1="200" x2="757" y2="200"/>
    <line x1="668" y1="168" x2="659" y2="159"/>
    <line x1="732" y1="232" x2="741" y2="241"/>
    <line x1="732" y1="168" x2="741" y2="159"/>
    <line x1="668" y1="232" x2="659" y2="241"/>
  </g>
  <!-- Stylised temple silhouette centre -->
  <g fill="rgba(16,40,32,0.95)">
    <!-- main shikhara -->
    <polygon points="700,310 680,420 720,420" />
    <rect x="676" y="420" width="48" height="60"/>
    <!-- left spire -->
    <polygon points="645,345 631,415 659,415"/>
    <rect x="629" y="415" width="32" height="45"/>
    <!-- right spire -->
    <polygon points="755,345 741,415 769,415"/>
    <rect x="739" y="415" width="32" height="45"/>
    <!-- base platform -->
    <rect x="580" y="460" width="240" height="20"/>
    <rect x="560" y="478" width="280" height="12"/>
  </g>
  <!-- Arch frame foreground (decorative) -->
  <path d="M320 700 Q320 480 520 400 Q700 340 880 400 Q1080 480 1080 700"
        fill="none" stroke="rgba(232,155,60,0.18)" stroke-width="3"/>
  <!-- Stars -->
  <g fill="rgba(255,255,255,0.55)">
    <circle cx="120" cy="80" r="1.2"/><circle cx="250" cy="50" r="1"/><circle cx="380" cy="120" r="1.4"/>
    <circle cx="500" cy="60" r="1"/><circle cx="600" cy="90" r="1.2"/><circle cx="840" cy="55" r="1"/>
    <circle cx="950" cy="85" r="1.3"/><circle cx="1100" cy="65" r="1.1"/><circle cx="1250" cy="100" r="1"/>
    <circle cx="1350" cy="45" r="1.2"/><circle cx="180" cy="140" r="0.9"/><circle cx="430" cy="155" r="1"/>
    <circle cx="780" cy="130" r="0.8"/><circle cx="1020" cy="145" r="1"/><circle cx="1300" cy="155" r="0.9"/>
  </g>
</svg>
