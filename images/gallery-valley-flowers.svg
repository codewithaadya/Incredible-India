<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a1a"/>
      <stop offset="100%" stop-color="#4a8a30"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g)"/>
  <!-- Sky -->
  <rect width="600" height="200" fill="rgba(100,160,220,0.4)"/>
  <!-- Mountains -->
  <polygon points="0,200 120,80 240,200" fill="rgba(80,120,80,0.7)"/>
  <polygon points="200,200 340,60 480,200" fill="rgba(70,110,70,0.75)"/>
  <polygon points="400,200 520,90 600,160 600,200" fill="rgba(80,120,80,0.65)"/>
  <!-- Flower meadow -->
  <rect x="0" y="200" width="600" height="200" fill="rgba(60,130,50,0.7)"/>
  <!-- Flowers -->
  <g opacity="0.9">
    <circle cx="60" cy="240" r="8" fill="#E89B3C"/><circle cx="120" cy="260" r="7" fill="#B9674D"/>
    <circle cx="200" cy="245" r="9" fill="#FAF7F0"/><circle cx="280" cy="255" r="8" fill="#E89B3C"/>
    <circle cx="360" cy="242" r="7" fill="#B9674D"/><circle cx="440" cy="258" r="9" fill="#FAF7F0"/>
    <circle cx="520" cy="248" r="8" fill="#E89B3C"/><circle cx="90" cy="290" r="7" fill="#FAF7F0"/>
    <circle cx="170" cy="300" r="8" fill="#E89B3C"/><circle cx="250" cy="285" r="7" fill="#B9674D"/>
    <circle cx="330" cy="295" r="9" fill="#FAF7F0"/><circle cx="410" cy="288" r="8" fill="#E89B3C"/>
    <circle cx="490" cy="298" r="7" fill="#B9674D"/>
  </g>
  <text x="300" y="365" text-anchor="middle"
        font-family="Georgia, serif" font-size="18" font-weight="700"
        letter-spacing="0.08em" fill="rgba(255,255,255,0.9)">VALLEY OF FLOWERS</text>
  <text x="300" y="390" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="11" letter-spacing="0.12em"
        fill="rgba(255,255,255,0.55)">UTTARAKHAND</text>
</svg>
