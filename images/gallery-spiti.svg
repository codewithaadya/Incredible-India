<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8d8e8"/>
      <stop offset="100%" stop-color="#8aaPAR"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#a8bcd0"/>
  <!-- Misty sky -->
  <rect width="600" height="200" fill="rgba(200,215,230,0.7)"/>
  <!-- Mountains -->
  <polygon points="0,400 100,140 220,400" fill="rgba(150,160,170,0.8)"/>
  <polygon points="100,400 250,80 400,400" fill="rgba(160,170,180,0.85)"/>
  <polygon points="320,400 460,110 600,280 600,400" fill="rgba(145,158,170,0.8)"/>
  <!-- Snow caps -->
  <polygon points="250,80 228,118 272,118" fill="rgba(255,255,255,0.92)"/>
  <polygon points="100,140 82,168 118,168" fill="rgba(255,255,255,0.85)"/>
  <polygon points="460,110 442,142 478,142" fill="rgba(255,255,255,0.88)"/>
  <!-- Monastery on hill -->
  <rect x="230" y="240" width="70" height="50" fill="rgba(210,170,110,0.85)"/>
  <rect x="245" y="228" width="40" height="18" fill="rgba(190,150,90,0.85)"/>
  <polygon points="265,218 243,232 287,232" fill="rgba(180,60,30,0.8)"/>
  <!-- Prayer flags -->
  <line x1="230" y1="228" x2="310" y2="228" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
  <g opacity="0.7">
    <rect x="238" y="222" width="8" height="10" fill="#E89B3C"/>
    <rect x="252" y="222" width="8" height="10" fill="#FAF7F0"/>
    <rect x="266" y="222" width="8" height="10" fill="#B9674D"/>
    <rect x="280" y="222" width="8" height="10" fill="#183D32"/>
    <rect x="294" y="222" width="8" height="10" fill="#E89B3C"/>
  </g>
  <!-- River -->
  <path d="M0 350 Q200 335 400 345 Q520 350 600 340 L600 370 L0 370 Z"
        fill="rgba(80,140,180,0.45)"/>
  <text x="300" y="393" text-anchor="middle"
        font-family="Georgia, serif" font-size="18" font-weight="700"
        letter-spacing="0.08em" fill="rgba(40,40,55,0.85)">SPITI VALLEY</text>
</svg>
